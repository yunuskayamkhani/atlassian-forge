modules:
  jira:globalPage:
    - key: bitbucket-engineering-dashboard
      resource: main
      resolver:
        function: resolver
      title: Bitbucket Engineering
      layout: blank
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/dashboard/build
    tunnel:
      port: 3000
permissions:
  scopes:
    - storage:app
    - read:jira-work
    - read:jira-user
    - read:board-scope:jira-software
    - read:sprint:jira-software
    - read:project:jira
    - read:issue-details:jira
    - read:jql:jira
  external:
    fetch:
      backend:
        - address: https://api.bitbucket.org
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/27695bb5-f353-45df-ab93-3a29984f2ea1
